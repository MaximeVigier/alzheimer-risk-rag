name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Dépendances légères uniquement : la CI teste chunking/retrieval/génération/API
          # avec les modèles lourds (embeddings, LLM local) mockés — pas d'installation
          # d'Ollama ni de téléchargement de modèles en CI.
          pip install fastapi "uvicorn[standard]" pydantic pytest pytest-mock httpx \
                      rank_bm25 chromadb ollama

      - name: Run tests
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t alzheimer-risk-rag-api .
